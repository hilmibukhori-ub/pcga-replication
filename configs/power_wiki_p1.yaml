# P1 (DEVIATIONS.md): power re-simulation on the REAL RSR Wiki topology. No RSR returns are used.
# Same DGP and ridge as power v2.1, except: the graph is the real Wiki graph (C1), sector shocks
# use the RSR industry labels (C2), the test period is 237 days, K_L3 = 99, and L1/L2 are omitted
# (they are not needed for R1-R4).
# Reported only as a realistic MDE. This does not change PREREG_RSR.md.

experiment:
  name: power_wiki_p1
  output_dir: outputs/power_wiki_p1
  seed: 20261112
  reps: {NASDAQ: 100, NYSE: 100}
  K_L3: 99

cells:
  NASDAQ: {train: 756, val: 252, test: 237}
  NYSE:   {train: 756, val: 252, test: 237}

effects_r2: [0.0, 0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005]

world:
  own_r2: 0.001
  sector_shock_share: 0.15
  vol_ar: 0.95
  vol_sd: 0.30
  t_df: 4

model:
  ridge_alpha_grid: [1.0, 100.0, 10000.0, 1000000.0]

inference:
  level: 0.05
  holm_worst_level: 0.0125   # alpha/4, the smallest Holm threshold in R1-R4
  block_length: 20
  repetitions: 1000
